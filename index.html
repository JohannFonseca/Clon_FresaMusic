<!-- inicio el documento -->
<html lang="es">
    <!-- configuracion y el titulo de la pagina -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon Fresa Music - Tienda de Instrumentos Musicales</title>
    <!-- fuentes de google para que se vea bien -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- el link a los estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- encabezado principal -->
    <header class="site-header">
        <div class="header-content">
            <div class="header-left">
                <!-- logo que subi -->
                <div class="logo-top">
                    <img src="img/logo.png" alt="Fresa Music Logo" class="header-logo-img">
                </div>
            </div>
            <!-- menu de navegacion -->
            <nav class="header-nav">
                <ul>
                    <li><a href="#">INICIO</a></li>
                    <li><a href="#" class="has-submenu">TIENDA</a></li>
                    <li><a href="#">LA EMPRESA</a></li>
                    <li><a href="#">SERVICIOS</a></li>
                    <li><a href="#">CONTACTO</a></li>
                    <li><a href="#">INICIO DE SESIÓN</a></li>
                </ul>
            </nav>
            <div class="header-right">
                <!-- buscador del lado derecho -->
                <div class="search-bar">
                    <input type="text" placeholder="Buscar productos ...">
                    <button class="search-btn">🔍</button>
                </div>
                <!-- icono del carrito -->
                <div class="cart-status">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- banner principal con imagen de fondo -->
        <section class="hero-slider">
            <!-- flechitas para mover el banner -->
            <button class="slider-arrow prev">❮</button>
            <button class="slider-arrow next">❯</button>

            <!-- el fondo del banner -->
            <div class="hero-container-image">
                <img src="img/ImagenFondo.png" alt="Fresa Music Banner Principal" class="main-banner-img">
            </div>
            
            <!-- el boton de whatsapp que flota -->
            <a href="#" class="whatsapp-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            </a>
        </section>
    </main>

</body>
</html>
